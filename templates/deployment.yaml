{{- /* krateo:gate begin — generated from architecture.yaml; edit the descriptor, not this block. */}}
{{- $gate := true -}}
{{- $dep0 := lookup "eventfeedback.example.io/v1alpha1" "Form" $.Release.Namespace (printf "%s-form" $.Release.Name | trunc 63 | trimSuffix "-") -}}
{{- $ok0 := false -}}
{{- range (dig "status" "conditions" (list) $dep0) -}}{{- if and (eq (toString .type) "Ready") (eq (toString .status) "True") -}}{{- $ok0 = true -}}{{- end -}}{{- end -}}
{{- if not $ok0 -}}{{- $gate = false -}}{{- end -}}
{{- $dep1 := lookup "compute.cnrm.cloud.google.com/v1beta1" "ComputeInstance" $.Release.Namespace (printf "%s-computeinstance" $.Release.Name | trunc 63 | trimSuffix "-") -}}
{{- $ok1 := false -}}
{{- range (dig "status" "conditions" (list) $dep1) -}}{{- if and (eq (toString .type) "Ready") (eq (toString .status) "True") -}}{{- $ok1 = true -}}{{- end -}}{{- end -}}
{{- if not $ok1 -}}{{- $gate = false -}}{{- end -}}
{{- if $gate }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-deployment" $.Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-meetup" $.Release.Name | trunc 63 | trimSuffix "-" }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ printf "%s-meetup" $.Release.Name | trunc 63 | trimSuffix "-" }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ printf "%s-meetup" $.Release.Name | trunc 63 | trimSuffix "-" }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: web
          image: {{ .Values.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: {{ .Values.resources.cpuRequest }}
              memory: {{ .Values.resources.memoryRequest }}
            limits:
              cpu: {{ .Values.resources.cpuLimit }}
              memory: {{ .Values.resources.memoryLimit }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probePath }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.probePath }}
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- /* krateo:gate end */}}
