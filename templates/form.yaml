apiVersion: eventfeedback.example.io/v1alpha1
kind: Form
metadata:
  name: {{ printf "%s-form" $.Release.Name | trunc 63 | trimSuffix "-" }}
spec:
  title: {{ .Values.surveyTitle }}
  configurationRef:
    # The Configure-credentials page writes the Configuration into the
    # RestDefinition's own namespace and seeds its name from the RestDefinition,
    # so krateo-system/event-feedback-form is the only object that can exist.
    name: event-feedback-form
    namespace: krateo-system
