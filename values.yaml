image: "ghcr.io/krateo-blueprints/meetup-site-app:0.4.0"
replicas: 1
resources:
  cpuRequest: "100m"
  cpuLimit: "500m"
  memoryRequest: "128Mi"
  memoryLimit: "256Mi"
probePath: "/"
surveyTitle: "Meetup feedback"
machineType: "e2-small"
# debian-11 was retired by GCP; a ComputeInstance naming a dead family never reconciles.
bootImage: "debian-cloud/debian-12"
gcpProject: "operations-dev-krateo-io"
