# REGISTERS this blueprint: core-provider pulls the chart, generates the CRD from values.schema.json
# and serves the Kind MeetupSite as composition.krateo.io/v0-4-0.
# Register it from the portal once release 0.4.0 is green (builder deliverables -> Register).
# The same file is attached to https://github.com/krateo-blueprints/meetup-site/releases/tag/0.4.0.
# The version is Chart.yaml's, literally; the release workflow refuses a tag that differs.
apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: meetup-site
  namespace: krateo-system
spec:
  chart:
    url: oci://ghcr.io/krateo-blueprints/charts/meetup-site
    version: 0.4.0
