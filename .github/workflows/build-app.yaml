# Publishes the web app in app/ to ghcr.io/<owner>/meetup-site-app.
#
# A Krateo builder seeds release.yaml for the CHART; this is its sibling for the IMAGE that chart
# references, so the blueprint and the app it deploys are released by one repository and neither can
# rot alone.
#
# The version comes from Chart.yaml, not from a git ref. It cannot come from the ref: the chart's own
# release job creates its tag with GITHUB_TOKEN, and a tag pushed with GITHUB_TOKEN does not trigger
# workflows — so a tag-driven image build would never fire. A separate app-X.Y.Z tag would then become
# the image tag verbatim, and the chart would name one version while the registry held another.
#
# Like release.yaml, this is a thin wrapper over the org's component-image-build.yaml, which asserts a
# release tag is contained in main and builds a real multi-platform manifest.
name: build-app

on:
  push:
    branches: ["main"]
    paths: ["app/**", "Chart.yaml", ".github/workflows/build-app.yaml"]
  pull_request:
    paths: ["app/**", "Chart.yaml", ".github/workflows/build-app.yaml"]
  workflow_dispatch: {}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          set -euo pipefail
          v="$(sed -n 's/^version:[[:space:]]*//p' Chart.yaml | head -1 | tr -d "\"' ")"
          # An empty version would silently restore the ref-derived tags this exists to replace.
          [ -n "$v" ] || { echo "::error::Chart.yaml declares no version; the image has nothing to be tagged with"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice::publishing meetup-site-app:$v, from Chart.yaml"

  image:
    needs: version
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"meetup-site-app","context":"app"}]'
      version: ${{ needs.version.outputs.version }}
      push: ${{ github.event_name != 'pull_request' }}
