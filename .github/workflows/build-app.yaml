# Publishes the web app in app/ to ghcr.io/<owner>/meetup-site-app.
#
# A Krateo builder seeds release.yaml for the CHART; this is its sibling for the IMAGE the chart
# references, so the blueprint and the app it deploys are released by the same repository and neither
# can rot alone.
#
# Like release.yaml, this is a thin wrapper: the build lives in the org's component-image-build.yaml,
# so a fix made there reaches every repository without touching any of them. That workflow asserts the
# tag is on main — a tag cut from a side branch would publish an image built from code that was never
# merged, under a version implying it was, and the result is indistinguishable afterwards.
#
# A tag `app-X.Y.Z` publishes that version. A pull request touching app/ builds without pushing, so the
# check says whether the merge can.
name: build-app

on:
  push:
    tags: ["app-[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: ["app/**", ".github/workflows/build-app.yaml"]
  workflow_dispatch:

jobs:
  image:
    uses: krateo-platformops/.github/.github/workflows/component-image-build.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      modules: '[{"mod":"meetup-site-app","context":"app"}]'
      push: ${{ startsWith(github.ref, 'refs/tags/') }}
